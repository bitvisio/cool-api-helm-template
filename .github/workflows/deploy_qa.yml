name: Deploy - QA

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: [ ubuntu-latest ]
    permissions:
      contents: write
      packages: write

    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install toml module
        run: |
          python -m pip install toml

      - name: Get version from pyproject.toml and set it as a env variable and as a output
        id: get_version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.get_version.outputs.VERSION }}',
              sha: context.sha
            })

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.get_version.outputs.VERSION }}
  
  deploy_qa:
    runs-on: [ ubuntu-latest ]
    needs: build_and_push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.20.0'

      - name: Create .kube directory
        run: |
          mkdir -p $HOME/.kube
  
      - name: Decode KUBECONFIG_TEST
        run: echo "${{ secrets.KUBECONFIG_TEST }}" | base64 --decode > $HOME/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install qa-cool-example-api ./helm/cool-example-api \
            --namespace kube-apps-qa --create-namespace \
            -f ./helm/cool-example-api/values-qa.yaml \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }} \
            --set image.tag=${{ needs.build_and_push.outputs.VERSION }}
