name: Deploy - PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_production:
    runs-on: [ ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.20.0'

      - name: Create .kube directory
        run: |
          mkdir -p $HOME/.kube
  
      - name: Decode KUBECONFIG_PROD
        run: echo "${{ secrets.KUBECONFIG_PROD }}" | base64 --decode > $HOME/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install cool-example-api ./helm/cool-example-api \
            --namespace kube-apps --create-namespace \
            -f ./helm/cool-example-api/values-prod.yaml \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
